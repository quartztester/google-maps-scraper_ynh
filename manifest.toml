#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "gmaps"
name = "Google Maps Scraper"
description.en = "Scrape Google Maps business listings with a web UI and REST API"
description.fr = "Extracteur de fiches Google Maps avec interface web et API REST"

version = "1.18.1~ynh1"

maintainers = ["quartztester"]

[upstream]
license = "MIT"
code = "https://github.com/gosom/google-maps-scraper"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64"]
multi_instance = true

ldap = "not_relevant"
sso = "not_relevant"

disk = "1G"
ram.build = "350M"
ram.runtime = "1G"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

[resources]
    [resources.sources.main]
    url = "https://github.com/gosom/google-maps-scraper/releases/download/v1.18.1/google_maps_scraper-1.18.1-linux-amd64"
    sha256 = "af573eeab19b174e8a70a5c804b80f191681b2c9d01c96706691af6567926062"
    extract = false
    rename = "gmaps"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["webdata"]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8080

    [resources.apt]
    packages = "ca-certificates, libnss3, libnspr4, libatk1.0-0, libatk-bridge2.0-0, libcups2, libdrm2, libdbus-1-3, libxkbcommon0, libatspi2.0-0, libx11-6, libxcomposite1, libxdamage1, libxext6, libxfixes3, libxrandr2, libgbm1, libpango-1.0-0, libcairo2, libasound2"
